<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost & Found | Report Item</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">Lost & Found</a>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="report-item.html">Report Item</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="register.html">Register</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Report Lost or Found Item</h2>
            <form class="report-form">
                <div class="form-group">
                    <label for="item-type">Item Type</label>
                    <select id="item-type" name="item-type" required>
                        <option value="">Select item type</option>
                        <option value="wallet">Wallet/Purse</option>
                        <option value="phone">Phone</option>
                        <option value="keys">Keys</option>
                        <option value="jewelry">Jewelry</option>
                        <option value="bag">Bag/Backpack</option>
                        <option value="documents">Documents</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="item-status">Status</label>
                    <select id="item-status" name="item-status" required>
                        <option value="">Select status</option>
                        <option value="lost">I lost this item</option>
                        <option value="found">I found this item</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="item-name">Item Name/Description</label>
                    <input type="text" id="item-name" name="item-name" required>
                </div>
                
                <div class="form-group">
                    <label for="item-location">Location</label>
                    <input type="text" id="item-location" name="item-location" required placeholder="Where was it lost/found?">
                </div>
                
                <div class="form-group">
                    <label for="item-date">Date</label>
                    <input type="date" id="item-date" name="item-date" required>
                </div>
                
                <div class="form-group">
                    <label for="item-description">Detailed Description</label>
                    <textarea id="item-description" name="item-description" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="item-image">Upload Image (optional)</label>
                    <input type="file" id="item-image" name="item-image" accept="image/*">
                </div>
                
                <div class="form-group">
                    <label for="contact-method">Preferred Contact Method</label>
                    <select id="contact-method" name="contact-method" required>
                        <option value="email">Email</option>
                        <option value="phone">Phone</option>
                    </select>
                </div>
                
                <button type="submit" class="btn">Submit Report</button>
            </form>
        </div>
    </main>

    

    <script src="script.js"></script>
</body>
</html>
